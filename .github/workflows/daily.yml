name: issue-scout

on:
  workflow_dispatch:   # manual only until you add a schedule; see README "Schedule"

permissions:
  contents: write   # commit state/seen.json
  id-token: write   # authenticate to the owner's email relay without user mail credentials

concurrency: scout

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCOUT_PICKER_PROVIDER: ${{ vars.SCOUT_PICKER_PROVIDER || 'groq' }}
      SCOUT_SOLVER_PROVIDER: ${{ vars.SCOUT_SOLVER_PROVIDER || 'claude-code' }}
      SCOUT_PICKER_MODEL: ${{ vars.SCOUT_PICKER_MODEL }}
      SCOUT_SOLVER_MODEL: ${{ vars.SCOUT_SOLVER_MODEL }}
      SCOUT_MODEL: ${{ vars.SCOUT_MODEL || 'openai/gpt-oss-120b' }}
      SCOUT_PICKER_AUTH: ${{ vars.SCOUT_PICKER_AUTH || 'auto' }}
      SCOUT_SOLVER_AUTH: ${{ vars.SCOUT_SOLVER_AUTH || 'auto' }}
      SCOUT_PICKER_BASE_URL: ${{ vars.SCOUT_PICKER_BASE_URL }}
      SCOUT_SOLVER_BASE_URL: ${{ vars.SCOUT_SOLVER_BASE_URL }}
      # Set by the Issue Scout app when email is on. The address and on/off switch live in profile.json.
      SCOUT_EMAIL_RELAY_URL: ${{ vars.SCOUT_EMAIL_RELAY_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk space
        run: |
          df -h /
          # Validation SDKs live in Docker; these host SDKs are unused by the scout.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/swift
          docker image prune --all --force
          df -h /
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Scout and selected CLI backends
        run: |
          pip install --no-cache-dir -r requirements.txt
          if [ "$SCOUT_PICKER_PROVIDER" = "claude-code" ] || [ "$SCOUT_SOLVER_PROVIDER" = "claude-code" ]; then
            npm install -g @anthropic-ai/claude-code
          fi
          if [ "$SCOUT_PICKER_PROVIDER" = "codex" ] || [ "$SCOUT_SOLVER_PROVIDER" = "codex" ]; then
            npm install -g @openai/codex
          fi
          npm cache clean --force
      - run: python -u scout.py
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          SCOUT_API_KEY: ${{ secrets.SCOUT_API_KEY }}
          SCOUT_PICKER_API_KEY: ${{ secrets.SCOUT_PICKER_API_KEY }}
          SCOUT_SOLVER_API_KEY: ${{ secrets.SCOUT_SOLVER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      - name: Upload scout report and patch
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: scout-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/report.txt
            reports/change.patch
            reports/notification.json
            reports/message.eml
            reports/result.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remember discovery progress and picked issues
        if: ${{ always() }}
        run: |
          git config user.name "issue-scout"
          git config user.email "issue-scout@users.noreply.github.com"
          for state_file in state/seen.json state/discovery.json; do
            [ ! -f "$state_file" ] || git add -- "$state_file"
          done
          git diff --cached --quiet || { git commit -m "scout: remember discovery progress and picked issues" && git push; }
