[pytest]
# Shuffle test order every run, so a test that only passes in file order fails loudly.
# Order only, not RNG state: pytest-randomly's per-test reseeding calls every registered
# RNG, and a numpy/thinc install anywhere in the interpreter rejects the derived value
# with "Seed must be between 0 and 2**32 - 1". Reproduce a specific order with
# --randomly-seed=<the seed printed in the header>.
addopts = --randomly-dont-reset-seed
